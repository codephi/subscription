[package]
name = "subscription"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
authors = ["Philippe Assis <codephilippe@gmail.com>"]

[features]
default = []
mcp = ["dep:rmcp", "dep:schemars"]

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "macros",
    "migrate",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
    "io-std",
] }
tower-http = { version = "0.7.0", features = ["cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
    "grpc-tonic",
    "http-json",
    "http-proto",
    "reqwest-client",
    "trace",
] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
axum-tracing-opentelemetry = { version = "0.38.0", features = [
    "tracing_level_info",
] }
tracing-opentelemetry = "0.33.0"
uuid = { version = "1.23.4", features = ["serde", "v4"] }
base64 = "0.22"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
bytes = "1.12.0"
rmcp = { version = "2.0.0", features = [
    "transport-streamable-http-server",
], optional = true }
schemars = { version = "1", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5.3", features = ["util"] }
testcontainers = "0.27.3"
